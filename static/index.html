<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aegis — Risk Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#05070C; --panel:#0B1019; --panel2:#080C14; --edge:#1A2435; --hair:#131B27;
  --ink:#E9F1FB; --ink2:#7E90AC; --ink3:#42506A;
  --allow:#00E5A0; --step_up:#FFC53D; --review:#FF8A3D; --block:#FF3D6E;
  --sans:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:46px 46px;background-position:-1px -1px}
button{font:inherit}
:focus-visible{outline:2px solid var(--allow);outline-offset:2px;border-radius:4px}
.shell{max-width:1420px;margin:0 auto;padding:16px 18px 40px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.mark{display:flex;align-items:center;gap:11px}
.mark h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.03em}
.mark p{margin:0;font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.hud{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:var(--ink2);border:1px solid var(--edge);border-radius:99px;padding:5px 11px;background:var(--panel2)}
.pip{width:5px;height:5px;border-radius:99px;background:var(--allow);box-shadow:0 0 7px var(--allow);animation:beat 2.2s infinite}
@keyframes beat{0%,100%{opacity:.3}50%{opacity:1}}
.hud input{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:99px;padding:6px 13px;font:inherit;font-size:11.5px;width:150px}
.hud input:focus{border-color:#2B4665;outline:none}

/* layout */
.rig{display:grid;grid-template-columns:236px minmax(0,1fr) 310px;gap:14px;align-items:stretch}
@media(max-width:1180px){.rig{grid-template-columns:230px minmax(0,1fr)}.railR{grid-column:1/-1}}
@media(max-width:820px){.rig{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:15px}
.ph{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink3);margin:0 0 12px}

/* inputs */
.tabs{display:flex;gap:4px;margin-bottom:13px;background:var(--panel2);padding:3px;border-radius:8px;border:1px solid var(--hair)}
.tab{flex:1;background:transparent;border:0;color:var(--ink2);border-radius:6px;padding:7px 2px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{color:var(--ink)}
.tab[aria-pressed=true]{background:#16203000;background-color:#152032;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink3)}
.f input,.f select{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:7px;padding:8px 9px;font:inherit;font-size:12.5px;width:100%}
.f input:focus,.f select:focus{border-color:#2B4665;outline:none}
.go{margin-top:14px;width:100%;background:var(--allow);color:#04120C;border:0;border-radius:8px;padding:11px;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:-.01em;transition:.15s;box-shadow:0 0 0 0 rgba(0,229,160,.5)}
.go:hover:not(:disabled){box-shadow:0 0 22px -4px rgba(0,229,160,.65)}
.go:disabled{opacity:.35;cursor:not-allowed}
.err{display:none;margin-top:10px;font-size:11.5px;color:var(--block);background:rgba(255,61,110,.08);border:1px solid rgba(255,61,110,.3);border-radius:7px;padding:9px 10px}
.err.show{display:block}

/* ===== GRAPH ===== */
.stagepane{padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
.stagepane svg{display:block;width:100%;height:auto;flex:1}
.scan{position:absolute;left:0;right:0;height:110px;pointer-events:none;opacity:0;
  background:linear-gradient(transparent,rgba(0,229,160,.05),transparent)}
.scan.run{animation:sweep 1.5s linear}
@keyframes sweep{0%{opacity:1;transform:translateY(-110px)}100%{opacity:0;transform:translateY(560px)}}

.ein,.eout{fill:none;stroke:var(--hair);stroke-width:1.2}
.ein.live{stroke:var(--ink3);stroke-dasharray:5 7;animation:flow .55s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.eout{opacity:0;stroke-width:1.6}
.eout.on{opacity:1;animation:grow .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes grow{from{stroke-dashoffset:var(--l)}to{stroke-dashoffset:0}}

.sbox{fill:var(--panel2);stroke:var(--hair);stroke-width:1}
.sled{fill:var(--ink3)}
.scode{font-family:var(--mono);font-size:10px;fill:var(--ink3);letter-spacing:.02em}
.swt{font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--ink3)}
.sig{opacity:.4;transition:opacity .2s}
.sig.probe{opacity:1}
.sig.probe .sbox{stroke:var(--ink3)}
.sig.clear{opacity:.28}
.sig.hit{opacity:1}
.sig.hit .scode{fill:var(--ink)}

.evbox{fill:var(--panel2);stroke:var(--edge);stroke-width:1.5}
.evring{fill:none;stroke:var(--allow);stroke-width:1.5;opacity:0}
.evring.go{animation:burst .9s ease-out}
@keyframes burst{0%{opacity:.85;r:34}100%{opacity:0;r:78}}
.evtxt{font-family:var(--mono);font-size:10px;fill:var(--ink2);text-anchor:middle;letter-spacing:.08em}

.vdbox{fill:var(--panel2);stroke:var(--edge);stroke-width:1.5}
.vdscore{font-family:var(--mono);font-size:44px;font-weight:700;fill:var(--ink3);text-anchor:middle;letter-spacing:-.04em}
.vdlabel{font-family:var(--sans);font-size:13px;font-weight:800;fill:var(--ink3);text-anchor:middle;letter-spacing:.04em;text-transform:uppercase}
.vdcap{font-family:var(--mono);font-size:9px;fill:var(--ink3);text-anchor:middle;letter-spacing:.1em}
.vdhalo{fill:none;stroke-width:2;opacity:0}
.vdhalo.go{animation:vburst 1.1s ease-out}
@keyframes vburst{0%{opacity:.9;r:52}100%{opacity:0;r:104}}

/* right rail */
.ladwrap{display:flex;gap:30px;height:200px;margin-bottom:14px;padding-left:2px}
.lad{position:relative;flex:0 0 26px}
.ltrack{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--hair);border-radius:5px;overflow:hidden}
.lfill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ink3);transition:height .7s cubic-bezier(.22,1,.36,1),background .3s,box-shadow .3s}
.lticks{position:relative;flex:1;min-width:0}
.lt{position:absolute;left:0;right:0;height:1px;background:var(--hair);transition:background .3s}
.lt b{position:absolute;left:0;bottom:5px;font-size:11.5px;font-weight:700;color:var(--ink3);transition:color .3s;white-space:nowrap}
.lt i{position:absolute;right:calc(100% + 8px);bottom:-6px;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink3);transition:color .3s}
.lt.lit{background:currentColor;height:2px}
.lt.lit b{color:currentColor}
.lt.lit i{color:currentColor}
.rawsum{font-family:var(--mono);font-size:10px;color:var(--ink3);margin:-4px 0 12px;letter-spacing:.03em}
.rawsum b{color:var(--ink2);font-weight:500}
.vnote{font-size:12px;color:var(--ink2);line-height:1.45;min-height:52px;border-top:1px solid var(--hair);padding-top:12px}
.did{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:9px}

/* queue */
.qwrap{margin-top:14px}
.qh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.tal{display:flex;gap:14px;flex-wrap:wrap}
.tal span{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.05em}
.tal b{font-size:13px;color:var(--ink);margin-right:4px}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.qc{background:var(--panel2);border:1px solid var(--hair);border-top:2px solid var(--ink3);border-radius:0 0 9px 9px;padding:11px 13px}
.qt{display:flex;justify-content:space-between;align-items:baseline;gap:9px}
.qs{font-family:var(--mono);font-size:18px;font-weight:700}
.qd{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.qu{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:2px}
.qr{font-family:var(--mono);font-size:9.5px;color:var(--ink2);margin-top:7px;line-height:1.7;word-break:break-word}
.qa{display:flex;gap:6px;margin-top:10px}
.qa button{flex:1;background:transparent;border:1px solid var(--edge);color:var(--ink2);border-radius:6px;padding:6px;font-size:10.5px;cursor:pointer;transition:.15s}
.qa .fr:hover{border-color:var(--block);color:var(--block)}
.qa .fp:hover{border-color:var(--allow);color:var(--allow)}
.qe{grid-column:1/-1;text-align:center;color:var(--ink3);font-size:12px;border:1px dashed var(--edge);border-radius:9px;padding:22px;font-family:var(--mono)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="shell">

  <div class="top">
    <div class="mark">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#00E5A0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M12 2.5 4.5 5.3v6.1c0 4.8 3.2 8 7.5 9.6 4.3-1.6 7.5-4.8 7.5-9.6V5.3L12 2.5Z"/><path d="M9 12.2l2.1 2.1L15.4 10"/>
      </svg>
      <div><h1>Aegis</h1><p>ACCOUNT TAKEOVER &amp; TRANSACTION RISK</p></div>
    </div>
    <div class="hud">
      <span class="chipx"><span class="pip"></span>ENGINE LIVE</span>
      <span class="chipx" id="lat_ms">LATENCY —</span>
      <button class="chipx" id="newsess" style="cursor:pointer" title="Start a fresh user so history is empty">NEW SESSION</button>
      <input id="apikey" placeholder="X-API-Key" aria-label="API key"/>
    </div>
  </div>

  <div class="rig">

    <!-- input -->
    <div class="pane">
      <p class="ph">01 · EVENT</p>
      <div class="tabs" role="group" aria-label="Scenarios">
        <button class="tab" data-s="clean" aria-pressed="true">Routine</button>
        <button class="tab" data-s="takeover" aria-pressed="false">Takeover</button>
        <button class="tab" data-s="bigtxn" aria-pressed="false">Transfer</button>
      </div>
      <div class="fs">
        <div class="f"><label for="user_id">USER</label><input id="user_id" value="alice"/></div>
        <div class="f"><label for="event_type">TYPE</label><select id="event_type"><option value="login">login</option><option value="transaction">transaction</option></select></div>
        <div class="f"><label for="lat">LAT</label><input id="lat" value="28.61"/></div>
        <div class="f"><label for="lon">LON</label><input id="lon" value="77.21"/></div>
        <div class="f"><label for="device_id">DEVICE</label><input id="device_id" value="phone"/></div>
        <div class="f"><label for="ip">IP</label><input id="ip" value="1.1.1.1"/></div>
        <div class="f"><label for="amount">AMOUNT &#8377;</label><input id="amount" placeholder="&mdash;"/></div>
        <div class="f"><label for="failed_attempts">FAILED</label><input id="failed_attempts" value="0"/></div>
      </div>
      <button class="go" id="go">Run evaluation</button>
      <div class="err" id="err" role="alert"></div>
    </div>

    <!-- graph -->
    <div class="pane stagepane">
      <div class="scan" id="scan"></div>
      <svg viewBox="0 0 940 540" preserveAspectRatio="xMidYMid meet" aria-label="Signal evaluation graph">
        <g id="edgesIn"><path class="ein" id="ein0" d="M130,270.0 C246,270.0 310,46 378,46"/>
<path class="ein" id="ein1" d="M130,270.0 C246,270.0 310,102 378,102"/>
<path class="ein" id="ein2" d="M130,270.0 C246,270.0 310,158 378,158"/>
<path class="ein" id="ein3" d="M130,270.0 C246,270.0 310,214 378,214"/>
<path class="ein" id="ein4" d="M130,270.0 C246,270.0 310,270 378,270"/>
<path class="ein" id="ein5" d="M130,270.0 C246,270.0 310,326 378,326"/>
<path class="ein" id="ein6" d="M130,270.0 C246,270.0 310,382 378,382"/>
<path class="ein" id="ein7" d="M130,270.0 C246,270.0 310,438 378,438"/>
<path class="ein" id="ein8" d="M130,270.0 C246,270.0 310,494 378,494"/></g>
        <g id="edgesOut"><path class="eout" id="eout0" d="M562,46 C650,46 688,270.0 792,270.0"/>
<path class="eout" id="eout1" d="M562,102 C650,102 688,270.0 792,270.0"/>
<path class="eout" id="eout2" d="M562,158 C650,158 688,270.0 792,270.0"/>
<path class="eout" id="eout3" d="M562,214 C650,214 688,270.0 792,270.0"/>
<path class="eout" id="eout4" d="M562,270 C650,270 688,270.0 792,270.0"/>
<path class="eout" id="eout5" d="M562,326 C650,326 688,270.0 792,270.0"/>
<path class="eout" id="eout6" d="M562,382 C650,382 688,270.0 792,270.0"/>
<path class="eout" id="eout7" d="M562,438 C650,438 688,270.0 792,270.0"/>
<path class="eout" id="eout8" d="M562,494 C650,494 688,270.0 792,270.0"/></g>

        <g transform="translate(96,270)">
          <circle class="evring" id="evring" r="34"/>
          <rect class="evbox" x="-34" y="-34" width="68" height="68" rx="12"/>
          <text class="evtxt" y="-4">EVENT</text>
          <text class="evtxt" y="12" id="evkind" style="fill:#42506A">login</text>
        </g>

        <g id="signals"><g class="sig" id="sig0" data-code="IMPOSSIBLE_TRAVEL" transform="translate(470,46)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">IMPOSSIBLE_TRAVEL</text><text class="swt" x="80" y="4" text-anchor="end">60</text></g>
<g class="sig" id="sig1" data-code="AMOUNT_ANOMALY" transform="translate(470,102)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">AMOUNT_ANOMALY</text><text class="swt" x="80" y="4" text-anchor="end">30</text></g>
<g class="sig" id="sig2" data-code="HIGH_VELOCITY" transform="translate(470,158)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">HIGH_VELOCITY</text><text class="swt" x="80" y="4" text-anchor="end">22</text></g>
<g class="sig" id="sig3" data-code="FAILED_LOGINS" transform="translate(470,214)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">FAILED_LOGINS</text><text class="swt" x="80" y="4" text-anchor="end">20</text></g>
<g class="sig" id="sig4" data-code="NEW_DEVICE" transform="translate(470,270)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">NEW_DEVICE</text><text class="swt" x="80" y="4" text-anchor="end">18</text></g>
<g class="sig" id="sig5" data-code="LARGE_AMOUNT" transform="translate(470,326)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">LARGE_AMOUNT</text><text class="swt" x="80" y="4" text-anchor="end">15</text></g>
<g class="sig" id="sig6" data-code="UNUSUAL_HOUR" transform="translate(470,382)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">UNUSUAL_HOUR</text><text class="swt" x="80" y="4" text-anchor="end">10</text></g>
<g class="sig" id="sig7" data-code="NEW_IP" transform="translate(470,438)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">NEW_IP</text><text class="swt" x="80" y="4" text-anchor="end">8</text></g>
<g class="sig" id="sig8" data-code="ML_ANOMALY" transform="translate(470,494)"><rect class="sbox" x="-92" y="-19" width="184" height="38" rx="8"/><circle class="sled" cx="-76" cy="0" r="3.5"/><text class="scode" x="-63" y="4">ML_ANOMALY</text><text class="swt" x="80" y="4" text-anchor="end">30</text></g></g>

        <g transform="translate(838,270)">
          <circle class="vdhalo" id="vdhalo" r="52"/>
          <rect class="vdbox" x="-58" y="-62" width="116" height="124" rx="14"/>
          <text class="vdcap" y="-38">RISK SCORE</text>
          <text class="vdscore" id="vdscore" y="8">—</text>
          <text class="vdlabel" id="vdlabel" y="40">IDLE</text>
        </g>
      </svg>
    </div>

    <!-- verdict rail -->
    <div class="pane railR">
      <p class="ph">03 · RESPONSE</p>
      <div class="ladwrap">
        <div class="lad"><div class="ltrack"><div class="lfill" id="lfill"></div></div></div>
        <div class="lticks" style="margin-left:26px">
          <div class="lt" id="lt-block"   style="bottom:70%"><i>70</i><b>Block</b></div>
          <div class="lt" id="lt-review"  style="bottom:45%"><i>45</i><b>Review</b></div>
          <div class="lt" id="lt-step_up" style="bottom:20%"><i>20</i><b>Step up</b></div>
          <div class="lt" id="lt-allow"   style="bottom:0"><i>0</i><b>Allow</b></div>
        </div>
      </div>
      <div class="rawsum" id="rawsum"></div>
      <div class="vnote" id="vnote">Rules carry fixed weights. The model adds up to 30 more. Where the total lands decides the response.</div>
      <div class="did" id="did"></div>
    </div>
  </div>

  <div class="qwrap">
    <div class="pane">
      <div class="qh"><p class="ph" style="margin:0">04 · REVIEW QUEUE</p><div class="tal" id="tal"></div></div>
      <div class="qg" id="queue"><div class="qe">NO ITEMS FLAGGED</div></div>
    </div>
  </div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var TIER={allow:"--allow",step_up:"--step_up",review:"--review",block:"--block"};
var NOTE={allow:"Nothing unusual. The user goes straight through.",
 step_up:"Enough doubt to ask for another factor, not enough to refuse.",
 review:"Held for an analyst. The customer isn't blocked yet.",
 block:"Refused outright. Signals point strongly to compromise."};
var ORDER=["IMPOSSIBLE_TRAVEL","AMOUNT_ANOMALY","HIGH_VELOCITY","FAILED_LOGINS","NEW_DEVICE","LARGE_AMOUNT","UNUSUAL_HOUR","NEW_IP","ML_ANOMALY"];
var css=function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()};
var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var headers=function(){var h={"content-type":"application/json"};var k=$("apikey").value.trim();if(k)h["X-API-Key"]=k;return h};
var SID = Math.random().toString(36).slice(2,6);
var SC={};
function buildScenarios(){
  SC={clean:{user_id:"alice-"+SID,event_type:"login",lat:"28.61",lon:"77.21",device_id:"phone",ip:"1.1.1.1",amount:"",failed_attempts:"0"},
   takeover:{user_id:"alice-"+SID,event_type:"login",lat:"51.50",lon:"-0.12",device_id:"unknown",ip:"9.9.9.9",amount:"",failed_attempts:"3"},
   bigtxn:{user_id:"raj-"+SID,event_type:"transaction",lat:"28.61",lon:"77.21",device_id:"phone",ip:"1.1.1.1",amount:"250000",failed_attempts:"0"}};
}
buildScenarios();
[].forEach.call(document.querySelectorAll(".tab"),function(t){t.onclick=function(){
  [].forEach.call(document.querySelectorAll(".tab"),function(x){x.setAttribute("aria-pressed","false")});
  t.setAttribute("aria-pressed","true");var s=SC[t.dataset.s];for(var k in s)$(k).value=s[k];
  $("evkind").textContent=s.event_type; clearVerdict();}});

function clearVerdict(){
  resetGraph();
  $("vdscore").textContent="\u2014"; $("vdscore").style.fill="";
  $("vdlabel").textContent="IDLE"; $("vdlabel").style.fill="";
  $("lfill").style.height="0"; $("lfill").style.background=""; $("lfill").style.boxShadow="";
  $("rawsum").textContent=""; $("did").textContent="";
  $("vnote").textContent="Rules carry fixed weights. The model adds up to 30 more. Where the total lands decides the response.";
}
var num=function(v){return v===""?null:Number(v)};

function resetGraph(){
  for(var i=0;i<9;i++){
    var n=$("sig"+i); n.className.baseVal="sig";
    n.querySelector(".sled").style.fill=""; n.querySelector(".sled").style.filter="";
    n.querySelector(".swt").style.fill=""; n.querySelector(".swt").textContent=ORDER[i]==="ML_ANOMALY"?"30":n.querySelector(".swt").dataset.base||n.querySelector(".swt").textContent;
    n.querySelector(".sbox").style.stroke=""; n.querySelector(".sbox").style.filter="";
    $("ein"+i).className.baseVal="ein";
    var eo=$("eout"+i); eo.className.baseVal="eout"; eo.style.stroke="";
  }
  ["allow","step_up","review","block"].forEach(function(k){var t=$("lt-"+k);t.classList.remove("lit");t.style.color=""});
}

function runGraph(d,colour,onEnd){
  var map={}; d.reasons.forEach(function(r){map[r.code]=r});
  resetGraph();
  $("evring").classList.remove("go"); void $("evring").offsetWidth; $("evring").classList.add("go");
  $("scan").classList.remove("run"); void $("scan").offsetWidth; if(!reduced)$("scan").classList.add("run");
  $("vdscore").textContent="—"; $("vdscore").style.fill=""; $("vdlabel").textContent="SCANNING"; $("vdlabel").style.fill=""; $("rawsum").textContent="";

  var i=0, running=0, gap=reduced?0:105;
  function step(){
    if(i>0){
      var p=i-1, code=ORDER[p], n=$("sig"+p);
      $("ein"+p).className.baseVal="ein";
      if(map[code]){
        n.className.baseVal="sig hit";
        n.querySelector(".sled").style.fill=colour;
        n.querySelector(".sled").style.filter="drop-shadow(0 0 5px "+colour+")";
        n.querySelector(".sbox").style.stroke=colour;
        n.querySelector(".swt").style.fill=colour;
        n.querySelector(".swt").textContent="+"+map[code].weight;
        var eo=$("eout"+p), L=eo.getTotalLength();
        eo.style.stroke=colour; eo.style.strokeDasharray=L;
        eo.style.setProperty("--l",L); eo.style.strokeDashoffset=reduced?0:L;
        void eo.offsetWidth; eo.className.baseVal="eout on";
        running+=map[code].weight;
      } else { n.className.baseVal="sig clear"; n.querySelector(".swt").textContent="—"; }
    }
    if(i>=9){ if(onEnd)onEnd(running); return; }
    $("sig"+i).className.baseVal="sig probe";
    $("ein"+i).className.baseVal="ein live";
    i++; setTimeout(step,gap);
  }
  step();
}

function paint(d,ms){
  var colour=css(TIER[d.decision])||css("--ink3");
  $("lat_ms").textContent="LATENCY "+ms+"MS";
  runGraph(d,colour,function(){
    $("vdhalo").style.stroke=colour;
    $("vdhalo").classList.remove("go"); void $("vdhalo").offsetWidth; $("vdhalo").classList.add("go");
    $("vdlabel").textContent=d.decision.replace("_"," ");
    $("vdlabel").style.fill=colour;
    $("vdscore").style.fill=colour;
    $("lfill").style.height=d.risk_score+"%";
    $("lfill").style.background=colour;
    $("lfill").style.boxShadow="0 0 18px -2px "+colour;
    var lt=$("lt-"+d.decision); if(lt){lt.style.color=colour;lt.classList.add("lit")}
    $("vnote").textContent=NOTE[d.decision]||"";
    var raw=0; d.reasons.forEach(function(r){raw+=r.weight});
    $("rawsum").innerHTML = raw>100
      ? 'WEIGHTS <b>'+raw+'</b> &rarr; CAPPED AT <b>100</b>'
      : 'WEIGHTS <b>'+raw+'</b>';
    $("did").textContent="DECISION "+d.decision_id.slice(0,8).toUpperCase();
    var n=0,t=d.risk_score;
    if(reduced||t===0){$("vdscore").textContent=t;return}
    var s=Math.max(1,Math.round(t/18));
    var iv=setInterval(function(){n=Math.min(t,n+s);$("vdscore").textContent=n;if(n>=t)clearInterval(iv)},26);
  });
}

async function evaluate(){
  var b=$("go"),e=$("err"); e.classList.remove("show");
  b.disabled=true; b.textContent="Evaluating\u2026";
  var t0=performance.now();
  try{
    var body={user_id:$("user_id").value,event_type:$("event_type").value,
      lat:num($("lat").value),lon:num($("lon").value),
      device_id:$("device_id").value||null,ip:$("ip").value||null,
      amount:num($("amount").value),failed_attempts:Number($("failed_attempts").value||0)};
    var r=await fetch("/v1/risk/evaluate",{method:"POST",headers:headers(),body:JSON.stringify(body)});
    if(!r.ok){var dt=await r.json().catch(function(){return{}});throw new Error(dt.detail||("Request failed ("+r.status+")"))}
    paint(await r.json(),Math.round(performance.now()-t0));
    refresh();
  }catch(x){e.textContent=x.message;e.classList.add("show")}
  finally{b.disabled=false;b.textContent="Run evaluation"}
}

async function refresh(){
  try{
    var s=await(await fetch("/v1/stats",{headers:headers()})).json();
    var o=["allow","step_up","review","block"];
    var k=o.filter(function(x){return x in s.decisions}).map(function(x){return[x,s.decisions[x]]});
    var rest=Object.keys(s.decisions).filter(function(x){return o.indexOf(x)===-1}).map(function(x){return[x,s.decisions[x]]});
    $("tal").innerHTML=k.concat(rest).map(function(e){
      return '<span><b>'+e[1]+'</b>'+e[0].replace("_"," ").toUpperCase()+'</span>'}).join("")
      +'<span><b>'+s.pending_review+'</b>PENDING</span>';
    var q=await(await fetch("/v1/review-queue",{headers:headers()})).json();
    $("queue").innerHTML=q.length?q.map(function(it){
      var c=css(TIER[it.decision])||css("--ink3");
      return '<div class="qc" style="border-top-color:'+c+'"><div class="qt">'+
        '<span class="qs" style="color:'+c+'">'+it.risk_score+'</span>'+
        '<span class="qd" style="color:'+c+'">'+it.decision.replace("_"," ")+'</span></div>'+
        '<div class="qu">'+it.user_token.slice(0,14)+'</div>'+
        '<div class="qr">'+it.reasons.map(function(r){return r.code}).join(" &middot; ")+'</div>'+
        '<div class="qa"><button class="fr" onclick="resolve(\''+it.decision_id+'\',\'confirmed_fraud\')">Confirm fraud</button>'+
        '<button class="fp" onclick="resolve(\''+it.decision_id+'\',\'false_positive\')">False positive</button></div></div>'}).join("")
      :'<div class="qe">NO ITEMS FLAGGED</div>';
  }catch(x){}
}
window.resolve=async function(id,label){
  await fetch("/v1/decisions/"+id+"/resolve",{method:"POST",headers:headers(),body:JSON.stringify({label:label})});
  refresh();
};
$("newsess").onclick=function(){
  SID=Math.random().toString(36).slice(2,6); buildScenarios();
  var act=document.querySelector('.tab[aria-pressed="true"]');
  var s=SC[act?act.dataset.s:"clean"]; for(var k in s)$(k).value=s[k];
  $("evkind").textContent=s.event_type; clearVerdict();
  $("lat_ms").textContent="SESSION "+SID.toUpperCase();
};
$("go").onclick=evaluate;
[].forEach.call(document.querySelectorAll(".f input"),function(i){
  i.addEventListener("keydown",function(e){if(e.key==="Enter")evaluate()})});
[].forEach.call(document.querySelectorAll(".swt"),function(w){w.dataset.base=w.textContent});
refresh();
</script>
